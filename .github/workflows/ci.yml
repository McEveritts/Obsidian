name: Obsidian Theme Build & Verification Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: CSS Build, Determinism & Layout Gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JS Syntax & Deterministic CSS Build
        run: npm test

      - name: Install browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Verify Live TV layout regressions
        run: npm run test:live-tv

      - name: Verify player OSD & overlay regressions
        run: npm run test:player-osd

      - name: Verify global controls, shell overlays, music/readers & card/table regressions
        run: npm run test:global-controls && npm run test:shell-overlays && npm run test:music-readers && npm run test:cards-tables && npm run test:xbox-nav

      - name: Verify compiled obsidian.css is up-to-date with src/ modules
        run: git diff --exit-code obsidian.css
