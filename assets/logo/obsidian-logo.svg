<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <radialGradient id="auroraCore" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="78%" stop-color="#d946ef" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="obsidianBase" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1424" />
      <stop offset="55%" stop-color="#05070f" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="specularRim" x1="20" y1="16" x2="140" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#d946ef" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="crystalLeft" x1="48" y1="28" x2="80" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="crystalRight" x1="80" y1="28" x2="116" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#c026d3" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.82" />
    </linearGradient>
    <linearGradient id="playGlow" x1="68" y1="64" x2="98" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Glass Container -->
  <rect x="14" y="14" width="132" height="132" rx="34" fill="url(#obsidianBase)" />
  <rect x="14" y="14" width="132" height="132" rx="34" fill="url(#auroraCore)" />
  <rect x="14.75" y="14.75" width="130.5" height="130.5" rx="33.25" stroke="url(#specularRim)" stroke-width="1.5" />

  <!-- Subtle Inner Specular Arc -->
  <path d="M 48 15.5 H 112" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round" />

  <!-- Faceted Obsidian Crystal Monolith -->
  <g filter="url(#softGlow)">
    <!-- Outer Left Facet -->
    <polygon points="80,26 42,58 54,118 80,134" fill="url(#crystalLeft)" />
    <!-- Outer Right Facet -->
    <polygon points="80,26 118,58 106,118 80,134" fill="url(#crystalRight)" />
    <!-- Inner Crown Facet -->
    <polygon points="80,26 58,64 80,54 102,64" fill="#a5b4fc" fill-opacity="0.28" />
    <!-- Inner Core Obsidian Facet -->
    <polygon points="80,54 58,64 64,106 80,134 96,106 102,64" fill="#050711" fill-opacity="0.72" />
    <!-- Specular Facet Edges -->
    <polygon points="80,26 42,58 54,118 80,134 106,118 118,58" stroke="url(#specularRim)" stroke-width="1.6" stroke-linejoin="round" />
    <polyline points="42,58 58,64 80,54 102,64 118,58" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.1" fill="none" />
    <polyline points="58,64 64,106 80,134 96,106 102,64" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.1" fill="none" />
    <line x1="80" y1="26" x2="80" y2="54" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" />
  </g>

  <!-- Central Media Play Emblem -->
  <path d="M 73 68.5 C 73 66.2 75.5 64.8 77.5 66.0 L 94.5 76.5 C 96.4 77.7 96.4 80.3 94.5 81.5 L 77.5 92.0 C 75.5 93.2 73 91.8 73 89.5 Z" fill="url(#playGlow)" />
</svg>
